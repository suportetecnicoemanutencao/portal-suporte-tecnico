[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# SUPABASE_URL e SUPABASE_ANON_KEY são públicas por natureza (vão para o navegador
# em public/js/config.js; o acesso é protegido pelas regras RLS do banco).
# A chave service_role continua secreta e nunca é escrita em arquivo.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# sempre buscar a versão nova da página, do JS e do CSS depois de cada deploy
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
